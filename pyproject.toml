[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "generic-scraper"
version = "0.1.0"
description = "Configurable scraping component for a distributed job orchestrator"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "beautifulsoup4",
    "lxml",
    "PyYAML",
]

[project.optional-dependencies]
browsers = ["playwright", "selenium"]
dev = ["pytest", "pytest-bdd", "ruff", "mypy"]

[project.scripts]
generic-scraper = "generic_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "property: property-based tests (run with -m property)",
    "hardening: mutation-hardening tests (run with -m hardening)",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
# Generated acceptance entry points embed the JSON IR verbatim; they are
# machine-written and regenerated by scripts/run-acceptance.sh.
extend-exclude = ["tests/acceptance/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["generic_scraper"]
mypy_path = "src"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["yaml", "requests", "lxml.*"]
ignore_missing_imports = true
