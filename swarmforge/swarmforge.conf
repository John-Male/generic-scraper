# swarmforge/swarmforge.conf
#
# Format: window <role> <agent> <worktree> [task|batch] [extra-cli-args...]
#
# All six roles run on the `claude` backend, i.e. the Claude Code CLI, using
# whichever account `claude` is logged in as on this machine. There is no
# API key here and none is wanted -- log in once with `claude` + /login and
# every agent inherits that session.
#
# SwarmForge launches the claude backend as:
#   claude --append-system-prompt-file <role-prompt> --permission-mode acceptEdits -n <role> [extra-args] "<role-prompt>"
#
# acceptEdits: agents edit files inside their own worktree freely but still
# ask before running shell commands. Append --permission-mode bypassPermissions
# to a line below if you later want that role fully hands-off. Do not do this
# for all six at once on a repo you care about.
#
# Receive mode: `task` (default) takes one handoff at a time. `batch` drains
# every queued equal-priority handoff as a single unit -- right for the review
# and hardening roles, which want to see a whole slice at once.
#
# The first window is the cleanup window: closing its Terminal window shuts
# down the entire swarm.

window specifier claude master
window coder claude coder
window cleaner claude cleaner batch
window architect claude architect batch
window hardener claude hardener batch
window QA claude QA batch
